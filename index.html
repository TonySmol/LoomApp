<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoomApp</title>
<style id="LOOM_CSS">

:root{
  --bg:#0b0f14;
  --panel:#111827;
  --text:#f8fbff;
  --muted:#99a7bf;
  --br:#1f2a44;
  --acc:#60a5fa;

  --ok:#22c55e;
  --warn:#f59e0b;
  --err:#ef4444;

  --focus:#60a5fa80;
  --top-bg:linear-gradient(180deg,#0d1220,#0a0f1c);
  --item-bg:#0f172a;

  --btn-bg:#18233a;
  --btn-text:#f8fbff;
  --btn-br:#223156;
  --btn-bg-hover:#1c2a49;
  --btn-bg-active:#1a2744;

  --btn-pr-bg:#60a5fa;
  --btn-pr-text:#0a0f1a;
  --btn-pr-br:#7fb5ff;
  --btn-pr-hover:#73b2ff;
  --btn-pr-active:#5aa1ee;

  --btn-d-bg:#1f1320;
  --btn-d-text:#ffdfe4;
  --btn-d-br:#3a1d29;
  --btn-d-hover:#2a0f15;
  --btn-d-active:#3a151c;

  --tab-active-bg:#0a1228;
  --tab-active-br:#203061;

  --code-bg:#09122a;
  --code-br:#14224a;
  --code-fg:#dbeafe;

  --menu-hover-bg:#0d1b3f;

  --left:320px;
  --topH:52px;
  --sbH:48px;

  /* Stable row metrics for modules list (left panel) */
  --modRow:48px;  /* uniform row height */
  --modGap:6px;   /* vertical gap between rows */
}

/* Global */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial;
  overflow-y:auto;
}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Top bar (rendered by UI.Topbar) */
.top{
  position:sticky;top:0;z-index:20;
  display:flex;flex-wrap:wrap;row-gap:6px;gap:8px;align-items:center;
  padding:10px 14px;min-height:var(--topH);
  border-bottom:1px solid var(--br);
  background:var(--top-bg)
}
.brand{font-weight:700;font-size:16px;color:var(--acc)}
.muted{color:var(--muted);font-size:12px}
.sp{flex:1}
.top .btn{min-height:36px}
@media (max-width:760px){
  .top .btn{padding:6px 8px;font-size:12px}
}

/* Buttons */
.btn{
  background:var(--btn-bg);
  color:var(--btn-text);
  border:1px solid var(--btn-br);
  padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px
}
.btn:hover{background:var(--btn-bg-hover)}
.btn:active{background:var(--btn-bg-active);color:var(--btn-text)}
.btn[disabled],.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.p{background:var(--btn-pr-bg);color:var(--btn-pr-text);border-color:var(--btn-pr-br)}
.btn.p:hover{background:var(--btn-pr-hover)}
.btn.p:active{background:var(--btn-pr-active);color:var(--btn-pr-text)}
.btn.danger{background:var(--btn-d-bg);color:var(--btn-d-text);border-color:var(--btn-d-br)}
.btn.danger:hover{background:var(--btn-d-hover)}
.btn.danger:active{background:var(--btn-d-active);color:var(--btn-d-text)}

/* Layout */
.grid{display:grid;grid-template-columns:var(--left) 1fr;gap:12px;padding:12px;height:calc(100vh - var(--topH) - var(--sbH) - 24px);overflow:hidden}
.panel{background:var(--panel);border:1px solid var(--br);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;height:100%}
.panel>header{
  display:flex;gap:8px;align-items:center;justify-content:space-between;
  padding:10px 12px;border-bottom:1px solid var(--br);
  position:sticky;top:0;background:var(--panel);z-index:2
}
.body{padding:12px}
.panel .body{flex:1 1 auto;overflow:auto;max-height:none}

/* Editor right panel: scroll only inside code */
.panel:not(.sidebar) > .body{display:flex;flex-direction:column;overflow:hidden}
.panel:not(.sidebar) > .body .code{flex:1 1 auto;overflow:auto}
.panel:not(.sidebar) > .body .ta{flex:1 1 auto;height:auto}

/* Tabs */
.tabs{display:flex;gap:6px;margin:8px 10px 0}
.tab{padding:8px 12px;border:1px solid var(--br);border-radius:8px;color:var(--muted);cursor:pointer;user-select:none;background:transparent}
.tab.a{color:var(--text);background:var(--tab-active-bg);border-color:var(--tab-active-br)}

/* Lists and items */
.list{display:flex;flex-direction:column;gap:6px}
.item{
  position:relative;
  display:flex;gap:8px;align-items:center;justify-content:space-between;
  padding:10px 12px;border:1px solid var(--br);border-radius:10px;background:var(--item-bg);
  cursor:pointer;min-height:48px
}
.item:hover{filter:brightness(1.05)}
.item.a{outline:none;box-shadow:inset 0 0 0 2px var(--acc)}
.item .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Stable left panel rows */
.panel.sidebar .v-slice{gap:var(--modGap)!important}
.panel.sidebar .item{
  height:var(--modRow);
  min-height:var(--modRow);
  overflow:hidden;
}

/* Key-value */
.kv{display:grid;grid-template-columns:160px 1fr;gap:8px;margin:6px 0;align-items:center}

/* Code/textarea */
.code{
  background:var(--code-bg);
  border:1px solid var(--code-br);
  border-radius:10px;padding:10px;white-space:pre;overflow:auto;
  font:12px/1.45 ui-monospace,Consolas,Menlo,monospace;color:var(--code-fg)
}
.ta{width:100%;height:320px}

/* Rows and inputs */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.input,select{
  background:var(--btn-bg);
  color:var(--text);
  border:1px solid var(--br);border-radius:8px;padding:8px 10px
}
.input::placeholder{color:var(--muted)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--err)}
.detail{margin-top:12px;padding:10px;border:1px solid var(--br);border-radius:10px;background:var(--item-bg)}
.badge{display:inline-block;padding:2px 6px;border:1px solid var(--btn-br);border-radius:6px;color:var(--muted);font-size:12px}
.note{color:var(--muted);font-size:12px;margin-top:6px}
.lbl{color:var(--muted)}

/* Status bar */
.statusbar{padding:8px 12px;border-top:1px solid var(--br);color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:space-between}

/* App area */
.show-app #loom-root{display:none}
#app-root{margin:12px;display:none}
.show-app #app-root{display:block}

/* Chips (filters) */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--btn-br);border-radius:999px;padding:6px 10px;cursor:pointer;color:var(--muted);background:transparent}
.chip.a{background:var(--btn-pr-bg);color:var(--btn-pr-text);border-color:var(--btn-pr-br)}
.chip:active{filter:brightness(1.05)}
.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Item menu placeholder */
.item .mwrap{position:relative}
.menu{
  position:absolute;right:0;top:36px;background:var(--panel);border:1px solid var(--br);
  border-radius:8px;min-width:160px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:5;display:none
}
.menu.a{display:block}
.menu .mi{padding:8px 10px;cursor:pointer;color:var(--text)}
.menu .mi:hover{background:var(--menu-hover-bg)}
.menu .mi.danger{color:var(--btn-d-text)}

/* Portal menu */
.portal-menu{position:fixed;z-index:3000;display:inline-block;box-sizing:border-box;width:220px}
.portal-menu .mi{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Left panel fit and footer */
.grid .panel.sidebar{height:100%}
.grid .panel.sidebar > .body{flex:1 1 auto;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable both-edges}
.left-footer{flex:0 0 auto;border-top:1px solid var(--br);padding:10px 12px;background:var(--panel)}
.v-slice{display:flex;flex-direction:column;gap:14px}

/* Command palette tweaks */
.cp .hdr input{
  background:var(--btn-bg)!important;border:1px solid var(--br)!important;color:var(--text)!important
}

/* Toasts bottom center & wider */
.loom-toasts{position:fixed;top:auto;right:auto;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:10px;align-items:center}
.loom-toast{background:var(--panel);border:1px solid var(--br);border-left:4px solid var(--acc);border-radius:10px;padding:10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.3);color:var(--text);width:min(640px,calc(100vw - 32px))}
.loom-toast.success{border-left-color:var(--ok)}
.loom-toast.warn{border-left-color:var(--warn)}
.loom-toast.error{border-left-color:var(--err)}

/* Mobile off-canvas sidebar */
@media (max-width:980px){
  .grid{grid-template-columns:1fr}
  .grid .panel.sidebar{height:auto !important}
  .panel.sidebar{position:fixed;left:0;top:var(--topH);bottom:0;width:min(88vw,360px);transform:translateX(-110%);transition:transform .2s ease;z-index:30}
  body.show-sidebar .panel.sidebar{transform:translateX(0)}
  .panel.sidebar > header{position:sticky;top:0;z-index:2}
  .panel.sidebar > .body{height:calc(100vh - var(--topH) - 52px);overflow:auto;padding-bottom:72px}
  .left-footer{position:sticky;bottom:0;background:var(--panel)}
  .sidebar-backdrop{display:none}
  body.show-sidebar .sidebar-backdrop{display:block;position:fixed;left:0;right:0;top:var(--topH);bottom:0;background:rgba(0,0,0,.5);z-index:25}
}

/* Topbar actions: spacing and stable layout */
.top .top-actions{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.top .top-actions .btn{margin:0}

/* Left panel module list: clearer selection and proper hover per theme */
body[data-theme=light] .panel.sidebar .item.a{box-shadow:inset 0 0 0 2px var(--text)}
body[data-theme=dark] .panel.sidebar .item.a{box-shadow:inset 0 0 0 2px var(--acc)}
body[data-theme=dark] .panel.sidebar .item:hover{filter:brightness(1.08)}
body[data-theme=light] .panel.sidebar .item:hover{filter:brightness(0.96)}

/* Greyscale selection/hover: dark=lighten, light=darken (high contrast) */
body[data-theme=dark]  .list .item:hover, body[data-theme=dark]  .panel.sidebar .item:hover{filter:none;background:linear-gradient(0deg, rgba(255,255,255,0.10), rgba(255,255,255,0.10)), var(--item-bg)}
body[data-theme=light] .list .item:hover, body[data-theme=light] .panel.sidebar .item:hover{filter:none;background:linear-gradient(0deg, rgba(0,0,0,0.08), rgba(0,0,0,0.08)), var(--item-bg)}
body[data-theme=dark]  .list .item.a,     body[data-theme=dark]  .panel.sidebar .item.a{box-shadow:inset 0 0 0 2px #dfe5ee}
body[data-theme=light] .list .item.a,     body[data-theme=light]  .panel.sidebar .item.a{box-shadow:inset 0 0 0 2px var(--text)}

/* tabs active */
body[data-theme=dark]  .tab.a{background:linear-gradient(0deg, rgba(255,255,255,0.06), rgba(255,255,255,0.06)), var(--tab-active-bg)}
body[data-theme=light] .tab.a{background:linear-gradient(0deg, rgba(0,0,0,0.05), rgba(0,0,0,0.05)), var(--tab-active-bg)}

/* Light theme: inputs/buttons */
body[data-theme=light] .input, body[data-theme=light] select{background:var(--btn-bg);color:var(--text);border:1px solid var(--btn-br)}
body[data-theme=light] .btn:hover{background:var(--btn-bg-hover)}
body[data-theme=light] .btn:active{background:var(--btn-bg-active)}
body[data-theme=light] :focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Ensure primary buttons override generic hover/active per theme */
body[data-theme=light] .btn.p:hover{background:var(--btn-pr-hover);color:var(--btn-pr-text)}
body[data-theme=light] .btn.p:active{background:var(--btn-pr-active);color:var(--btn-pr-text)}
body[data-theme=dark] .btn.p:hover{background:var(--btn-pr-hover);color:var(--btn-pr-text)}
body[data-theme=dark] .btn.p:active{background:var(--btn-pr-active);color:var(--btn-pr-text)}

</style>
</head>

  function vRenderSlice(){

    var total=S.v.total, list=S.v.list;

    if (!S.useVirt){

      slice.innerHTML="";
      for (var i=0;i<total;i++){
        (function(dd){
          var it=h("div",{class:"item"+(S.sel===dd.name?" a":""), onclick:function(e){
              if(e.target && e.target.classList.contains("mmore")) return;
              if(!confirmIfDirty()) return;

    var count = vViewportCount();
    var end = Math.min(total, start + count);

    var over = S.overscan||6;
    start = Math.max(0, start - over);
    end = Math.min(total, end + over);

    var oldS=S.v.start, oldE=S.v.end;
    S.v.start = start; S.v.end = end;
    if (start===oldS && end===oldE && slice && slice.childElementCount>0) return;

    var topH = start * step;
    var botH = Math.max(0, (total - end) * step);
    top.style.height = topH.toFixed(2)+"px";
    bot.style.height = botH.toFixed(2)+"px";

    slice.innerHTML="";
    for (var i=start;i<end;i++){
      (function(dd){
        var it=h("div",{class:"item"+(S.sel===dd.name?" a":""), onclick:function(e){
            if(e.target && e.target.classList.contains("mmore")) return;

<script type="text/loom-module" data-role="code">
function Module(ctx){
  var bar=null, brandEl=null, infoEl=null, spEl=null, wrapEl=null, mounted=false;
  var map=new Map(), listening=false;

  function ensure(){
    if (mounted) return;
    bar=document.querySelector(".top");
    if(!bar){
      bar=document.createElement("div");
      bar.className="top";
      var anchor=document.body.firstChild;
      document.body.insertBefore(bar, anchor);
    }
    try{ while(bar.firstChild){ bar.removeChild(bar.firstChild);} }catch(_){}

    brandEl=document.createElement("div"); brandEl.className="brand"; brandEl.textContent=(ctx && ctx.meta && ctx.meta.name) ? String(ctx.meta.name) : "Loom";
    infoEl=document.createElement("div"); infoEl.className="muted"; infoEl.id="loom-ver";
    spEl=document.createElement("div"); spEl.className="sp";
    wrapEl=document.createElement("div"); wrapEl.className="top-actions";
    bar.appendChild(brandEl); bar.appendChild(infoEl); bar.appendChild(spEl); bar.appendChild(wrapEl);
    mounted=true;
  }

  function render(){
    if(!mounted) return;
    wrapEl.innerHTML="";
    var arr=Array.from(map.values()).sort(function(a,b){ return (a.order||999) - (b.order||999); });
    arr.forEach(function(b){ wrapEl.appendChild(b.el); });
  }

  function addButton(opts){
    ensure();
    if(!opts || !opts.id) return;
    if (map.has(opts.id)){ removeButton(opts.id); }
    var btn=document.createElement("button");
    btn.className="btn"+(opts.primary?" p":"")+(opts.danger?" danger":"");
    btn.textContent=String(opts.text||"");
    if (opts.title) btn.setAttribute("title", String(opts.title));
    if (opts.ariaLabel) btn.setAttribute("aria-label", String(opts.ariaLabel));
    if (typeof opts.onClick==="function") btn.addEventListener("click", opts.onClick);
    if (opts.disabled) btn.setAttribute("disabled","disabled");
    map.set(opts.id, { id:opts.id, el:btn, order:opts.order||999 });
    render();
  }

  function removeButton(id){
    var it=map.get(id); if(!it) return;
    try{ it.el.remove(); }catch(_){}
    map.delete(id);
    render();
  }

  function clear(){
    map.forEach(function(it){ try{ it.el.remove(); }catch(_){} });
    map.clear();
    render();
  }

  function updateInfo(){
    try{
      var bver=(ctx.meta && ctx.meta.protected && ctx.meta.protected.bootloaderVersion)||"";
      var prof=(ctx.meta && ctx.meta.protected && ctx.meta.protected.runProfile)||"ide";
      infoEl.textContent = "v" + ((ctx.meta && ctx.meta.version) || "") + (bver?(" • boot "+bver):"") + (" • "+prof);
    }catch(_){}
  }

  function mount(){
    ensure();
    updateInfo();
    if (!listening && ctx.bus && ctx.bus.on){
      listening = true;
      ctx.bus.on("meta:changed", function(meta){
        try{
          brandEl.textContent = (meta && meta.name) ? String(meta.name) : "Loom";
          updateInfo();
        }catch(_){}
      });
    }
  }

  return { mount: mount, addButton:addButton, removeButton:removeButton, clear:clear, setInfo:function(text){ ensure(); infoEl.textContent=String(text||""); } };
}
</script>

      return;
    }
    top.addButton({
      id: BTN_ID,

  }

  function mountApp(name){

    try{
      var seg = String(path||"").split("."), cur=obj;
      for(var i=0;i<seg.length;i++){ if(!cur) return def; cur=cur[seg[i]]; }
      return (typeof cur==="undefined")?def:cur;
    }catch(_){ return def; }
  }

  function getApplied(){
    try{ return (ctx.store && ctx.store.get ? (ctx.store.get(KEY_APPLIED, [])||[]) : []); }
    catch(_){ return []; }
  }
  function setApplied(arr){
    try{
      var uniq = Array.from(new Set(arr||[]));
      if(ctx.store && ctx.store.set) ctx.store.set(KEY_APPLIED, uniq);
    }catch(_){}
  }
  function clone(obj){ return JSON.parse(JSON.stringify(obj)); }

  function isIdx(s){ return s==="-" || /^\d+$/.test(String(s)); }

  function jsonPatchApply(obj, patch){
    var target = obj;
    for (var i=0;i<(patch||[]).length;i++){
      var op = patch[i];
      var p = String(op.path||"");
      var segs = p.split("/").slice(1).map(function(s){ return s.replace(/~1/g,"/").replace(/~0/g,"~"); });
      var parent = target;
      for (var j=0;j<segs.length-1;j++){
        var s = segs[j];
        if(!(s in parent)){
          if(op.op==="add"){ parent[s] = isIdx(segs[j+1]) ? [] : {}; }
          else { throw new Error("Path not found: "+p); }
        }
        parent = parent[s];
        if (typeof parent!=="object" || parent===null) throw new Error("Path not object: "+p);
      }
      var key = segs[segs.length-1];
      if (op.op==="add"){
        if (Array.isArray(parent)){
          var idx = key==="-" ? parent.length : parseInt(key,10);
          if (isNaN(idx)) throw new Error("Array index invalid at "+p);
          parent.splice(idx,0,op.value);
        } else { parent[key]=op.value; }
      } else if (op.op==="replace"){
        if (Array.isArray(parent)){
          var idx2 = parseInt(key,10);
          if (isNaN(idx2) || idx2<0 || idx2>=parent.length) throw new Error("Index OOB "+p);
          parent[idx2]=op.value;
        } else { parent[key]=op.value; }
      } else if (op.op==="remove"){
        if (Array.isArray(parent)){
          var idx3 = parseInt(key,10);
          if (isNaN(idx3) || idx3<0 || idx3>=parent.length) throw new Error("Index OOB "+p);
          parent.splice(idx3,1);
        } else { delete parent[key]; }
      } else {
        throw new Error("Unsupported op: "+op.op);
      }
    }
    return target;
  }

  function textReplace(src, needle, repl, count, isRegex, flags){
    var s = String(src||"");
    if (typeof needle==="undefined" || needle===null) return { text:s, replaced:0 };
    var times = 0;
    if (isRegex){
      var fl = (typeof flags === "string" && flags) ? flags : "g";
      var re;
      try{ re = new RegExp(needle, fl); }catch(e){ throw new Error("Invalid regex: "+(e && e.message ? e.message : e)); }
      if (!count || count<=0){
        var out = s.replace(re, function(){ times++; return repl; });
        return { text: out, replaced: times };
      } else {
        var out2=""; var last=0; var m;
        while(times < count && (m = re.exec(s))){
          out2 += s.slice(last, m.index) + repl;
          last = m.index + m[0].length;
          times++;
          if (!re.global) break;
        }
        out2 += s.slice(last);
        return { text: out2, replaced: times };
      }
    }
    var nlen = String(needle).length;
    if (!nlen) return { text:s, replaced:0 };
    if (!count || count<=0){ count = Infinity; }
    var idx=0, out3="";
    while(idx < s.length){
      var pos = s.indexOf(needle, idx);
      if (pos<0 || times>=count){ out3 += s.slice(idx); break; }
      out3 += s.slice(idx, pos) + repl;
      idx = pos + nlen; times++;
    }
    return { text: out3, replaced: times };
  }

  function getBootEl(){
    var id = (ctx.meta && ctx.meta.protected && ctx.meta.protected.bootloaderId) || "LOOM_BOOT";
    return document.getElementById(id);
  }
  function getCSS(){ var el=document.getElementById("LOOM_CSS"); return el?el.textContent:""; }
  function setCSS(css){ var el=document.getElementById("LOOM_CSS"); if(el) el.textContent = css; }
  function getMeta(){ try{ var el=document.getElementById("LOOM_META"); return el?JSON.parse(el.textContent||"{}"):{}; }catch(_){ return {}; } }
  function setMeta(m){
    var el=document.getElementById("LOOM_META"); if(el) el.textContent = JSON.stringify(m);
    try{
      var keys=Object.keys(ctx.meta); for (var i=0;i<keys.length;i++) delete ctx.meta[keys[i]];
      Object.assign(ctx.meta, m||{});
      if (m && m.name){ document.title = m.name; }
    }catch(_){}
  }
  function getGuide(){ try{ var el=document.getElementById("LOOM_GUIDE"); return el?JSON.parse(el.textContent||"{}"):{}; }catch(_){ return {}; } }
  function setGuide(g){ var el=document.getElementById("LOOM_GUIDE"); if(el) el.textContent = JSON.stringify(g||{}); }

  function validate(patch){
    if (!patch || typeof patch!=="object") return { ok:false, error:"Patch is not object" };
    if (patch.$schema!=="loom.patch/1") return { ok:false, error:"Unsupported $schema (need loom.patch/1)" };
    if (!Array.isArray(patch.changes) || !patch.changes.length) return { ok:false, error:"No changes" };
    return { ok:true };
  }

  function checkGuards(patch){
    var g = patch.guards || {};
    var errs = [];
    if (g.appVersion){
      var v = String(safeGet(ctx, "meta.version", ""));
      if (v !== String(g.appVersion)) errs.push("appVersion mismatch");
    }
    if (g.bootloaderVersion){
      var bootEl = getBootEl();
      var attr = bootEl && bootEl.getAttribute("data-version");
      var metaBoot = String(safeGet(ctx, "meta.protected.bootloaderVersion", ""));
      if (String(attr)!==String(g.bootloaderVersion) || metaBoot!==String(g.bootloaderVersion)){
        errs.push("bootloaderVersion mismatch");
      }
    }
    return errs;
  }

  function applyChange(ch){
    var target = ch.target, method = ch.method;
    var res = { ok:true, detail:"" };
    try{
      if (typeof target==="string"){
        if (target==="css"){
          if (method==="append"){
            setCSS(getCSS()+String(ch.value||"")); res.detail="css appended";
          } else if (method==="text-replace"){
            if (!ch.regex && String(ch.needle||"")==="") throw new Error("empty needle");
            var r=textReplace(getCSS(), ch.needle, ch.replace, ch.count, ch.regex, ch.flags);
            setCSS(r.text); res.detail="css replaced:"+r.replaced;
          } else { throw new Error("Unsupported css method"); }
        } else if (target==="boot"){
          var boot = getBootEl(); if(!boot) throw new Error("Boot not found");
          if (method==="text-replace"){
            if (!ch.regex && String(ch.needle||"")==="") throw new Error("empty needle");
            var t=boot.textContent||"";
            var r2=textReplace(t, ch.needle, ch.replace, ch.count, ch.regex, ch.flags);
            boot.textContent=r2.text; res.detail="boot replaced:"+r2.replaced;
          } else if (method==="attr-set"){
            if (Array.isArray(ch.allowedAttrs) && ch.allowedAttrs.length && ch.allowedAttrs.indexOf(ch.attr)<0){
              throw new Error("attr not allowed: "+String(ch.attr));
            }
            boot.setAttribute(ch.attr, ch.value); res.detail="boot attr set";
          } else { throw new Error("Unsupported boot method"); }
        } else if (target==="meta"){
          if (method!=="json-patch") throw new Error("meta supports json-patch only");
          var m=getMeta(); var mm=jsonPatchApply(clone(m), ch.patch||[]); setMeta(mm); res.detail="meta patched";
        } else if (target==="guide"){
          if (method!=="json-patch") throw new Error("guide supports json-patch only");
          var g=getGuide(); var gg=jsonPatchApply(clone(g), ch.patch||[]); setGuide(gg); res.detail="guide patched";
        } else {
          throw new Error("Unknown target: "+target);
        }
      } else if (target && target.module){
        if (method==="module-add"){
          var u = ch.def;
          if (!u || !u.manifest || !u.manifest.name) throw new Error("def.manifest.name required");
          if (ctx.modules.exists(u.manifest.name)) throw new Error("Module exists: "+u.manifest.name);
          ctx.modules.add(u); res.detail="module added";
        } else if (method==="module-remove"){
          var ok = ctx.modules.remove(target.module);
          if (!ok) throw new Error("Module not found: "+target.module);
          res.detail="module removed";
        } else if (method==="module-rename"){
          var def0 = ctx.modules.getDef(target.module);
          if (!def0) throw new Error("Module not found: "+target.module);
          var newName = ch.newName; if(!newName) throw new Error("newName required");
          if (ctx.modules.exists(newName)) throw new Error("Module exists: "+newName);
          ctx.modules.add({ manifest: Object.assign({}, def0.manifest, { name:newName }), contract: def0.contract, code: def0.code });
          ctx.modules.remove(def0.manifest.name);
          var upd=0;
          if (ch.cascadeDependsOn===true){
            try{
              var list = ctx.modules.list() || [];
              for (var i=0;i<list.length;i++){
                var dname = list[i].name;
                if (dname === newName) continue;
                var d = ctx.modules.getDef(dname);
                var deps = (d && d.manifest && Array.isArray(d.manifest.dependsOn)) ? d.manifest.dependsOn.slice() : [];
                var changed=false;
                for (var j=0;j<deps.length;j++){ if (deps[j]===target.module){ deps[j]=newName; changed=true; } }
                if (changed){
                  d.manifest.dependsOn = deps;
                  ctx.modules.setDef(dname, d);
                  upd++;
                }
              }
            }catch(_){}
          }
          res.detail="module renamed:"+newName+(ch.cascadeDependsOn===true?("; dependsOn updated:"+upd):"");
        } else if (method==="json-patch"){
          var def = ctx.modules.getDef(target.module); if(!def) throw new Error("Module not found: "+target.module);
          if (target.role==="manifest"){
            def.manifest = jsonPatchApply(clone(def.manifest||{}), ch.patch||[]);
          } else if (target.role==="contract"){
            def.contract = jsonPatchApply(clone(def.contract||{}), ch.patch||[]);
          } else {
            throw new Error("json-patch supports manifest/contract");
          }
          ctx.modules.setDef(target.module, def); res.detail="module json-patched";
        } else if (method==="text-replace"){
          var def2 = ctx.modules.getDef(target.module); if(!def2) throw new Error("Module not found: "+target.module);
          if (target.role!=="code") throw new Error("text-replace supports code");
          if (!ch.regex && String(ch.needle||"")==="") throw new Error("empty needle");
          var r3=textReplace(def2.code||"", ch.needle, ch.replace, ch.count, ch.regex, ch.flags);
          def2.code=r3.text; ctx.modules.setDef(target.module, def2); res.detail="code replaced:"+r3.replaced;
        } else {
          throw new Error("Unsupported module method");
        }
      } else {
        throw new Error("Invalid target");
      }
    } catch(e){
      res.ok=false; res.detail=String(e && e.message ? e.message : e);
    }
    return res;
  }

  function dryRun(patch){
    var v=validate(patch); if(!v.ok) return { ok:false, error:v.error };
    var gs=checkGuards(patch); if(gs.length) return { ok:false, error:gs.join("; ") };
    var changes=(patch.changes||[]).map(function(ch){
      var out={ ok:true, detail:"ok" };
      try{
        if (typeof ch.target==="string"){
          if (ch.target==="css" && ch.method==="text-replace"){
            if (!ch.regex && String(ch.needle||"")===""){ out.ok=false; out.detail="empty needle"; }
            else {
              try{
                var css=getCSS();
                if (ch.regex){
                  var fl = (typeof ch.flags === "string" && ch.flags) ? ch.flags : "g";
                  var cnt = ((css.match(new RegExp(ch.needle, fl))||[]).length);
                  out.detail="css matches:"+cnt;
                } else {
                  var cnt2 = (css.split(ch.needle).length-1);
                  out.detail="css matches:"+cnt2;
                }
              }catch(e){ out.ok=false; out.detail="Invalid regex: "+(e && e.message ? e.message : e); }
            }
          } else if (ch.target==="boot" && ch.method==="text-replace"){
            var boot=getBootEl(); var t=boot?boot.textContent:"";
            if (!ch.regex && String(ch.needle||"")===""){ out.ok=false; out.detail="empty needle"; }
            else {
              try{
                if (ch.regex){
                  var flb = (typeof ch.flags === "string" && ch.flags) ? ch.flags : "g";
                  var c3 = ((t.match(new RegExp(ch.needle, flb))||[]).length);
                  out.detail=(boot?"boot matches:":"boot missing, matches:")+c3; if(!boot) out.ok=false;
                } else {
                  var c4 = (t.split(ch.needle).length-1);
                  out.detail=(boot?"boot matches:":"boot missing, matches:")+c4; if(!boot) out.ok=false;
                }
              }catch(e2){ out.ok=false; out.detail="Invalid regex: "+(e2 && e2.message ? e2.message : e2); }
            }
          } else if ((ch.target==="meta"||ch.target==="guide") && ch.method==="json-patch"){
            var src = ch.target==="meta" ? getMeta() : getGuide();
            jsonPatchApply(clone(src), ch.patch||[]); out.detail=ch.target+" patch OK";
          } else {
            out.detail="ok";
          }
        } else if (ch.target && ch.target.module){
          var exists = ctx.modules.exists(ch.target.module);
          if (ch.method==="module-add"){ out.detail="ok"; }
          else if (!exists){ out.ok=false; out.detail="module not found"; }
          else out.detail="ok";
        }
      }catch(e){ out.ok=false; out.detail=String(e.message||e); }
      return out;
    });
    return { ok:changes.every(function(x){return x.ok;}), changes:changes };
  }

  function apply(patch, opts){
    opts = opts || {};
    var v=validate(patch); if(!v.ok) return { ok:false, error:v.error };
    var gs=checkGuards(patch); if(gs.length) return { ok:false, error:gs.join("; ") };

    if (patch.allowBootPatch!==true){
      var triesBoot = (patch.changes||[]).some(function(ch){ return ch.target==="boot"; });
      if (triesBoot) return { ok:false, error:"Bootloader patch requires allowBootPatch:true" };
    }

    var id=patch.id;
    var ids=getApplied();
    if (id && !opts.force && ids.indexOf(id)>=0 && patch.allowReapply!==true) return { ok:false, error:"Patch already applied: "+id };

    var results=[];
    for (var i=0;i<(patch.changes||[]).length;i++){
      var r=applyChange(patch.changes[i]);
      results.push(r);
      if(!r.ok){
        return { ok:false, index:i, error:r.detail, results:results };
      }
    }

    if (patch.post && patch.post.runHealth && ctx.health && ctx.health.run){
      try{
        var H=ctx.health.run();
        var bad=H.filter(function(x){return !x.ok;}).length;
        results.push({ ok: bad===0, detail:"health "+(bad?"issues:"+bad:"ok") });
      }catch(e){ results.push({ ok:false, detail:"health error "+(e && e.message ? e.message : e) }); }
    }

    if (patch.post && patch.post.rebuild){
      var ser = ctx.require("Build.Serializer");
      if (ser){
        try{
          var src=ser.extract(); var html=ser.generate(src); ser.download(undefined, html);
          results.push({ok:true, detail:"rebuilt"});
        } catch(e){
          results.push({ok:false, detail:"rebuild error "+(e && e.message ? e.message : e)});
        }
      }
    }

    if (id){ ids.push(id); setApplied(ids); }

    return { ok:true, results:results };
  }

  function applyText(text, opts){
    var p;
    try{ p=JSON.parse(String(text||"{}")); }
    catch(e){ return { ok:false, error:"JSON parse error: "+(e && e.message ? e.message : e) }; }
    return apply(p, opts||{});
  }

  function open(){
    var modal=ctx.require("UI.Modal"); if(!modal){ alert("Modal not ready"); return; }
    var body=document.createElement("div");
    var ta=document.createElement("textarea"); ta.className="code ta"; ta.placeholder='{"$schema":"loom.patch/1","id":"...","changes":[...]}';
    var note=document.createElement("div"); note.className="note"; note.style.marginTop="8px";
    body.appendChild(ta); body.appendChild(note);
    function msg(t,ok){ note.textContent=t; note.style.color = ok ? "var(--ok)" : "var(--err)"; }
    modal.open({
      title:"Apply Patch",
      body:body,
      buttons:[
        { text:"Dry Run", onClick:function(){
          var r;
          try{ var p=JSON.parse(ta.value||"{}"); r=dryRun(p); }
          catch(e){ msg("Parse error: "+(e && e.message ? e.message : e), false); return; }
          msg(r.ok?("Dry run OK ("+(r.changes?r.changes.length:0)+" ops)") : ("Dry run failed: "+(r.error||"err")), r.ok);
        }},
        { text:"Apply", primary:true, onClick:function(){
          var r2;
          try{ var p2=JSON.parse(ta.value||"{}"); r2=apply(p2); }
          catch(e){ msg("Parse error: "+(e && e.message ? e.message : e), false); return; }
          var toast=ctx.require("UI.Toast");
          if(r2.ok){ msg("Applied OK", true); if(toast&&toast.success) toast.success("Patch applied"); }
          else { msg("Apply failed: "+(r2.error||"err"), false); if(toast&&toast.error) toast.error("Patch failed"); }
        }},
        { text:"Close", onClick:function(){ modal.close(); } }
      ]
    });
  }

  return { open: open, apply: apply, applyText: applyText, dryRun: dryRun, validate: validate };
}

<script type="text/loom-module" data-role="code">
function Module(ctx){
  "use strict";
  var SCHEMA="loom.blueprint/1";

  function uniq(a){ var s=new Set(); (a||[]).forEach(function(x){s.add(x);}); return Array.from(s); }
  function scan(code, re, group){
    var out=[], m, s=String(code||""); re.lastIndex=0;
    while((m=re.exec(s))){
      out.push(m[group||2]||m[2]||m[1]);
      if (re.lastIndex===m.index) re.lastIndex++;
    }
    return uniq(out);
  }

  function getModules(){
    var out=[], list = ctx.modules && ctx.modules.list ? ctx.modules.list() : [];
    for (var i=0;i<list.length;i++){
      var name=list[i].name, def=ctx.modules.getDef(name)||{}, man=def.manifest||{}, con=def.contract||{}, fns=[];
      try{
        var funs = con.functions || {};
        for (var k in funs){
          var fn = funs[k]||{};
          fns.push({ name:k, args:(fn.args||[]).map(function(a){ return (a&&a.type)||"any"; }), returns:(fn.returns&&fn.returns.type)||"any" });
        }
      }catch(_){}
      out.push({
        name:man.name, type:man.type, version:man.version,
        dependsOn:man.dependsOn||[], exports:man.exports||[],
        contract:{ functions:fns }
      });
    }
    return out;
  }

  function getSignals(){
    var res={ emitted:{}, listened:{}, storeKeys:{} };
    var list = ctx.modules && ctx.modules.list ? ctx.modules.list() : [];
    for (var i=0;i<list.length;i++){
      var name=list[i].name, def=ctx.modules.getDef(name)||{}, code=def.code||"";
      var em = scan(code, /ctx\.bus\.emit\s*\x28\s*(['"])([^'"]+)\1/g, 2);
      var on = scan(code, /ctx\.bus\.on\s*\x28\s*(['"])([^'"]+)\1/g, 2);
      var keys = scan(code, /ctx\.store\.(?:get|set|remove|clear)\s*\x28\s*(['"])?([^,'")\s]+)\1?/g, 2);
      if (em.length) res.emitted[name]=em;
      if (on.length) res.listened[name]=on;
      if (keys.length) res.storeKeys[name]=keys;
    }
    return res;
  }

  function anchors(){
    var arr=[];
    try{
      var d = ctx.modules.getDef("UI.Actions");
      var code = d && d.code || "";
      var needle = 'var sw = ctx.require("UI.AppSwitcher"); if (sw && sw.mount) sw.mount();';
      if (code.indexOf(needle)>=0){
        arr.push({
          id:"after-appswitcher-mount",
          module:"UI.Actions", role:"code", needle:needle,
          note:"Безопасная точка для добавления ещё одного mount вызова",
          exampleInsert:'\n var bp = ctx.require("UI.Blueprint"); if (bp && bp.mount) bp.mount();'
        });
      }
    }catch(_){}
    return arr;
  }

  function extPoints(){
    function has(n){ try{ return !!ctx.require(n); }catch(_){ return false; } }
    return {
      topbar: has("UI.Topbar"),
      palette: has("UI.CommandPalette"),
      modal: has("UI.Modal"),
      toast: has("UI.Toast"),
      layout: has("UI.Layout"),
      theme: has("UI.Theme"),
      host: has("App.Host"),
      serializer: has("Build.Serializer"),
      patcher: has("Build.Patcher"),
      health: has("Build.Health")
    };
  }

  function patcherOps(){
    return ["module-add","module-remove","module-rename","json-patch","text-replace","attr-set"];
  }

  function collect(){
    var bp = {
      $schema: SCHEMA,
      generatedAt: new Date().toISOString(),
      meta: {
        name: (ctx.meta && ctx.meta.name)||"",
        version: (ctx.meta && ctx.meta.version)||"",
        runProfile: (ctx.meta && ctx.meta.protected && ctx.meta.protected.runProfile)||"ide",
        bootloaderVersion: (ctx.meta && ctx.meta.protected && ctx.meta.protected.bootloaderVersion)||""
      },
      guide: ctx.guide || {},
      modules: getModules(),
      signals: getSignals(),
      extensionPoints: extPoints(),
      anchors: anchors(),
      patcher: { methods: patcherOps() }
    };
    try{
      if (ctx.health && ctx.health.run){
        var h = ctx.health.run();
        var bad = h.filter(function(x){ return !x.ok; });
        bp.health = { ok: bad.length===0, total: h.length, issues: bad.length };
      }
    }catch(_){}
    bp.totals = {
      modules: bp.modules.length,
      eventsEmitted: Object.keys(bp.signals.emitted).length,
      eventsListened: Object.keys(bp.signals.listened).length,
      storeUsers: Object.keys(bp.signals.storeKeys).length
    };
    return bp;
  }

  function exportJSON(){
    var j = JSON.stringify(collect(), null, 2);
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([j], {type:"application/json"}));
    a.download = "loom-blueprint-"+Date.now()+".json";
    document.body.appendChild(a); a.click(); URL.revokeObjectURL(a.href); a.remove();
  }

  function open(){
    var modal = ctx.require("UI.Modal");
    if (!modal){ alert("Modal not ready"); return; }
    var bp = collect();
    var body = document.createElement("div");
    var p = document.createElement("div"); p.className="note";
    p.textContent = "Blueprint: modules "+bp.totals.modules+", emitted/listened modules "+bp.totals.eventsEmitted+"/"+bp.totals.eventsListened+".";
    var pre = document.createElement("pre"); pre.className="code";
    pre.textContent = JSON.stringify({ meta: bp.meta, extensionPoints: bp.extensionPoints, totals: bp.totals, health: bp.health }, null, 2);
    body.appendChild(p); body.appendChild(pre);
    modal.open({ title:"Loom Blueprint", body: body,

      var factory = new Function("ctx", d.code + "\nreturn Module(ctx);");
      var exp = factory(ctx);
      registry.set(d.manifest.name, { def: d, exports: exp });
      try{
        if (d.manifest.name==="Core.Logger") ctx.log = exp || ctx.log;
        else if (d.manifest.name==="Core.Bus") ctx.bus = exp || ctx.bus;
        else if (d.manifest.name==="Core.Store") ctx.store = exp || ctx.store;
        else if (d.manifest.name==="Build.Health") ctx.health = exp || ctx.health;
      }catch(_){}
      return true;
    } catch(e) {
      console.error("Compile error", d.manifest && d.manifest.name, e);
      return false;
    }
  }

  function topoSort(items){
    var nameToItem = Object.create(null);
    var indeg = Object.create(null);
    var adj = Object.create(null);

    function typeIdx(it){
      var t = (it.manifest && it.manifest.type) || "";
      var idx = order.indexOf(t); return idx<0?99:idx;
    }

    items.forEach(function(it){
      var n = it.manifest.name;
      nameToItem[n] = it; indeg[n]=0; adj[n]=[];
    });
    items.forEach(function(it){
      var deps = (it.manifest && it.manifest.dependsOn) || [];
      var n = it.manifest.name;
      for (var i=0;i<deps.length;i++){
        var dep = deps[i];
        if (nameToItem[dep]){
          indeg[n]++; adj[dep].push(n);
        }
      }
    });

    var queue = Object.keys(nameToItem).filter(function(n){ return indeg[n]===0; });
    queue.sort(function(a,b){
      var da = typeIdx(nameToItem[a]) - typeIdx(nameToItem[b]); if (da!==0) return da;
      return a.localeCompare(b);
    });

    var out=[];
    while(queue.length){
      var n = queue.shift();
      out.push(nameToItem[n]);
      var arr = adj[n]||{};
      for (var i=0;i<(arr.length||0);i++){
        var m = arr[i]; indeg[m]--;
        if (indeg[m]===0){ queue.push(m); }
      }
      queue.sort(function(a,b){
        var da = typeIdx(nameToItem[a]) - typeIdx(nameToItem[b]); if (da!==0) return da;
        return a.localeCompare(b);
      });
    }

    if (out.length < items.length){
      console.warn("Dependency cycle or unresolved deps, fallback ordering by type/name");
      var rest = items.filter(function(it){ return out.indexOf(it)<0; });
      rest.sort(function(a,b){
        var da = typeIdx(a) - typeIdx(b); if (da!==0) return da;
        return (a.manifest.name||"").localeCompare(b.manifest.name||"");
      });
      out = out.concat(rest);
    }
    return out;
  }

  function compileAll(){
    var items = topoSort(defs.slice());
    registry.clear();
    for (var i=0;i<items.length;i++){
      compileOne(items[i]);
    }

    var logger = registry.has("Core.Logger") && registry.get("Core.Logger").exports; if (logger) ctx.log = logger;
    var bus = registry.has("Core.Bus") && registry.get("Core.Bus").exports; if (bus) ctx.bus = bus;
    var store = registry.has("Core.Store") && registry.get("Core.Store").exports; if (store) ctx.store = store;
    var health = registry.has("Build.Health") && registry.get("Build.Health").exports; if (health) ctx.health = health;

    updateGlobals();
  }

  function mountIDE(){
    var topbar = registry.has("UI.Topbar") && registry.get("UI.Topbar").exports;
    if (topbar && topbar.mount) topbar.mount();

    var shell = registry.has("UI.Shell") && registry.get("UI.Shell").exports;
    var actions = registry.has("UI.Actions") && registry.get("UI.Actions").exports;
    if (shell && actions) {
      if (shell.mount) shell.mount();
      if (actions.wire) actions.wire();
      if (ctx.log && ctx.log.info) ctx.log.info("UI mounted");
    } else {
      if (actions && actions.wire) actions.wire();
      if (!shell) console.warn("UI.Shell missing");
    }
  }

  function mountApp(entry){
    try{
      var host = registry.has("App.Host") && registry.get("App.Host").exports;
      if (host && host.mount) host.mount();
      try{ document.body.classList.add("show-app"); }catch(_){}
      if (entry){
        var app = registry.has(entry) && registry.get(entry).exports;
        if (app && typeof app.mount==="function") app.mount();
        else if (app && typeof app.init==="function") app.init();
        else console.warn("Entry app has no mount/init:", entry);
      }
    }catch(e){
      console.error("App mount error", e);
    }
  }

  function updateGlobals(){
    window.Loom = window.Loom || {};
    window.Loom.meta = ctx.meta;
    window.Loom.guide = ctx.guide;
    window.Loom.require = ctx.require;
    window.Loom.modules = ctx.modules;
    window.Loom.log = ctx.log;
    window.Loom.bus = ctx.bus;
    window.Loom.store = ctx.store;
    window.Loom.health = ctx.health;
  }

  document.addEventListener("DOMContentLoaded", function(){
    collect();
    compileAll();
    try {
      if (runProfile==="app"){
        mountApp(entryApp);
      } else {
        var w = registry.has("App.Welcome") && registry.get("App.Welcome").exports;
        if (w && w.init) w.init();
        mountIDE();
      }
    } catch(e) {
      if (ctx.log && ctx.log.warn) ctx.log.warn("Boot init failed", String(e));
    }
  });
})();


</script>
